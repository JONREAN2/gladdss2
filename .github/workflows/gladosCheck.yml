name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/'
  schedule:
    - cron: '0 4,10 * * *'
  watch:
    types: started

jobs:
  build:
    name: glados checkin
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    # 安装依赖
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pypushdeer

    # 运行脚本
    - name: running glados checkin
      run: |
        python glados_notify.py
      env:
        # ========= 推送 =========
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

        # ========= 兑换配置（只对第一个账号生效） =========
        GLADOS_EXCHANGE_PLAN: plan500
        GLADOS_ENABLE_EXCHANGE: "false" 

        # ========= GLaDOS 多账号 =========
        GLADOS_EMAILS_1: ${{ secrets.GLADOS_EMAILS_1 }}
        GLADOS_COOKIES_1: ${{ secrets.GLADOS_COOKIES_1 }}

        GLADOS_EMAILS_2: ${{ secrets.GLADOS_EMAILS_2 }}
        GLADOS_COOKIES_2: ${{ secrets.GLADOS_COOKIES_2 }}

        GLADOS_EMAILS_3: ${{ secrets.GLADOS_EMAILS_3 }}
        GLADOS_COOKIES_3: ${{ secrets.GLADOS_COOKIES_3 }}

        # 需要几个账号就继续往下加



    # 清理历史 workflow
    - name: delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 10
        delete_run_by_conclusion_pattern: success
