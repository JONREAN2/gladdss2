name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/'
  schedule:
    - cron: '30 15,16 * * *'  # 每天 04:00 和 10:00 UTC
  watch:
    types: started

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: glados checkin
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]

    steps:
    # 1️⃣ Checkout 仓库
    - uses: actions/checkout@v4

    # 2️⃣ Setup Python
    - name: set up python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    # 3️⃣ 安装依赖
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pypushdeer

    # 4️⃣ 执行签到脚本
    - name: running checkin
      run: |
        python glados_notify.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        GLADOS_EXCHANGE_PLAN: plan500
        GLADOS_ENABLE_EXCHANGE: "false" 

        GLADOS_EMAILS_1: ${{ secrets.GLADOS_EMAILS_1 }}
        GLADOS_COOKIES_1: ${{ secrets.GLADOS_COOKIES_1 }}

        GLADOS_EMAILS_2: ${{ secrets.GLADOS_EMAILS_2 }}
        GLADOS_COOKIES_2: ${{ secrets.GLADOS_COOKIES_2 }}

        GLADOS_EMAILS_3: ${{ secrets.GLADOS_EMAILS_3 }}
        GLADOS_COOKIES_3: ${{ secrets.GLADOS_COOKIES_3 }}

        GLADOS_EMAILS_4: ${{ secrets.GLADOS_EMAILS_4 }}
        GLADOS_COOKIES_4: ${{ secrets.GLADOS_COOKIES_4 }}

        GLADOS_EMAILS_5: ${{ secrets.GLADOS_EMAILS_5 }}
        GLADOS_COOKIES_5: ${{ secrets.GLADOS_COOKIES_5 }}

        GLADOS_EMAILS_6: ${{ secrets.GLADOS_EMAILS_6 }}
        GLADOS_COOKIES_6: ${{ secrets.GLADOS_COOKIES_6 }}

        GLADOS_EMAILS_7: ${{ secrets.GLADOS_EMAILS_7 }}
        GLADOS_COOKIES_7: ${{ secrets.GLADOS_COOKIES_7 }}

        GLADOS_EMAILS_8: ${{ secrets.GLADOS_EMAILS_8 }}
        GLADOS_COOKIES_8: ${{ secrets.GLADOS_COOKIES_8 }}

        GLADOS_EMAILS_9: ${{ secrets.GLADOS_EMAILS_9 }}
        GLADOS_COOKIES_9: ${{ secrets.GLADOS_COOKIES_9 }}

        GLADOS_EMAILS_10: ${{ secrets.GLADOS_EMAILS_10 }}
        GLADOS_COOKIES_10: ${{ secrets.GLADOS_COOKIES_10 }}

        GLADOS_EMAILS_11: ${{ secrets.GLADOS_EMAILS_11 }}
        GLADOS_COOKIES_11: ${{ secrets.GLADOS_COOKIES_11 }}

        GLADOS_EMAILS_12: ${{ secrets.GLADOS_EMAILS_12 }}
        GLADOS_COOKIES_12: ${{ secrets.GLADOS_COOKIES_12 }}

        GLADOS_EMAILS_13: ${{ secrets.GLADOS_EMAILS_13 }}
        GLADOS_COOKIES_13: ${{ secrets.GLADOS_COOKIES_13 }}

        GLADOS_EMAILS_14: ${{ secrets.GLADOS_EMAILS_14 }}
        GLADOS_COOKIES_14: ${{ secrets.GLADOS_COOKIES_14 }}

        GLADOS_EMAILS_15: ${{ secrets.GLADOS_EMAILS_15 }}
        GLADOS_COOKIES_15: ${{ secrets.GLADOS_COOKIES_15 }}

        GLADOS_EMAILS_16: ${{ secrets.GLADOS_EMAILS_16 }}
        GLADOS_COOKIES_16: ${{ secrets.GLADOS_COOKIES_16 }}


    # 5️⃣ 保持 workflow 活跃
    - name: keep alive
      uses: liskin/gh-workflow-keepalive@v1

    # 6️⃣ 删除旧 workflow
    - name: delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 10
        delete_run_by_conclusion_pattern: success
